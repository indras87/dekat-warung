services:
  db:
    image: postgres:16-alpine
    container_name: dekat-warung-db
    environment:
      POSTGRES_USER: dekat
      POSTGRES_PASSWORD: dekat
      POSTGRES_DB: dekat_warung
    # No host port published: the app reaches `db` over the compose network.
    # Host port 5432 is intentionally left free (a host Postgres may already use it).
    # To inspect from host: `docker compose exec db psql -U dekat -d dekat_warung`
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dekat -d dekat_warung"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: dekat-warung-app
    # In-container DATABASE_URL points at the `db` service over the compose
    # network (overrides any DATABASE_URL from .env, which targets the host).
    environment:
      DATABASE_URL: "postgresql://dekat:dekat@db:5432/dekat_warung?schema=public"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    # Pass runtime secrets (SESSION_SECRET, VAPID_*, CRON_SECRET, ...) from the
    # host .env. `.dockerignore` excludes .env from the image on purpose, so the
    # container receives them here. Explicit `environment` above still wins for
    # DATABASE_URL.
    env_file:
      - .env
    # Host port 3001 (not 3000): a host Next.js / another container may already
    # occupy 3000. Override with DEKAT_HOST_PORT if needed. Container still
    # listens on 3000 internally.
    ports:
      - "${DEKAT_HOST_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
